  <path d="M18 20 L32 32 L18 44" stroke="#ffffff" stroke-width="6.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 20 L47 32 L33 44" stroke="#ffffff" stroke-width="6.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
